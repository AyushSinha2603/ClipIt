<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Base Dark Mode */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 12px; width: 340px; margin: 0; background-color: #1a1a1a; color: #eee;
    }

    input, textarea {
      width: 100%; box-sizing: border-box; margin: 4px 0 10px; padding: 8px;
      font-family: inherit; font-size: 13px; background-color: #2b2b2b;
      color: #eee; border: 1px solid #444; border-radius: 4px;
      transition: border-color 0.1s;
    }
    input:focus, textarea:focus { border-color: #0969da; outline: none; box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3); }
    input::placeholder, textarea::placeholder { color: #888; }
    textarea { resize: vertical; }
    label { font-size: 12px; font-weight: bold; color: #aaa; }

    /* Highlight Buttons Row (from image_6.png) */
    .color-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .color-btn { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid #ccc; transition: transform 0.1s; }
    .color-btn:hover { transform: scale(1.1); border-color: #eee; }
    .color-btn[data-color="#fff59d"] { box-shadow: 0 0 10px rgba(255, 245, 157, 0.4); }
    .color-btn[data-color="#a5d6a7"] { box-shadow: 0 0 10px rgba(165, 214, 167, 0.4); }
    .color-btn[data-color="#90caf9"] { box-shadow: 0 0 10px rgba(144, 202, 249, 0.4); }
    .color-btn[data-color="#f48fb1"] { box-shadow: 0 0 10px rgba(244, 143, 177, 0.4); }

    /* Action buttons row below highlights */
    .action-row { display: flex; gap: 10px; margin-bottom: 12px; }
    button { border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background-color 0.1s; padding: 10px; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    /* Secondary Buttons */
    #snapBtn, #addNoteBtn { background: #24292f; color: white; flex-grow: 1; }
    #snapBtn:hover, #addNoteBtn:hover { background: #32383f; }

    /* Reset Button - Red outline style (from image_3.png) */
    #resetBtn { background: transparent; color: #cf222e; border: 1px solid #cf222e; padding: 9px; font-size: 13px; }
    #resetBtn:hover { background: rgba(207, 34, 46, 0.1); }

    /* UNIFIED CHRONOLOGICAL TIMELINE (Replacement) */
    .timeline-container {
      display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px;
      padding: 10px; background-color: #2b2b2b; border-radius: 6px;
      border: 1px solid #444; max-height: 250px; overflow-y: auto;
    }
    .timeline-item { position: relative; border: 1px solid #555; border-radius: 4px; padding: 8px; }
    .timeline-screenshot img { width: 100%; height: auto; object-fit: contain; border-radius: 4px; }
    .timeline-text { color: #eee; font-size: 13px; }
    .timeline-delete {
      position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
      background-color: #cf222e; color: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; cursor: pointer; opacity: 1;
    }

    /* Primary PDF Download Button (cohesive green from image_4.png) */
    #saveBtn { background: #2ea44f; color: white; width: 100%; margin-top: 10px; }
    #saveBtn:hover { background: #2a9244; }
    #saveBtn:disabled { background: #3e4a5d; cursor: wait; }

    /* Status message */
    .status { margin-top: 10px; font-size: 12px; text-align: center; color: #aaa; }
    .status.success { color: #6bc47d; }
    .status.error { color: #cf222e; }

    /* Styling for the note scratchpad */
    #scratchpad { height: 70px; }
  </style>
</head>
<body>
  <h3>ClipIt Notes Session</h3>
  <input type="text" id="noteTitle" placeholder="Untitled Session" />

  <label>Highlight on Page</label>
  <div class="color-row">
    <div class="color-btn" data-color="#fff59d" style="background: #fff59d;"></div>
    <div class="color-btn" data-color="#a5d6a7" style="background: #a5d6a7;"></div>
    <div class="color-btn" data-color="#90caf9" style="background: #90caf9;"></div>
    <div class="color-btn" data-color="#f48fb1" style="background: #f48fb1;"></div>
  </div>

  <div class="action-row">
    <button id="snapBtn"><span>&#128247;</span> Take Shot</button>
    <button id="resetBtn"><span>&#10005;</span> Reset Session</button>
  </div>

  <!-- PERSISTENT CHRONOLOGICAL TIMELINE (from image_6.png comment) -->
  <label>Session Timeline (Interleaved)</label>
  <div id="clipTimeline" class="timeline-container">
    <!-- Items rows will be injected by JS Master array List Master list master master master master master master master master master Master list Master array -->
  </div>

  <!-- Note Scratchpad -->
  <label>General Note Scratchpad</label>
  <textarea id="scratchpad" placeholder="Draft a new note to add..."></textarea>
  <button id="addNoteBtn">Add Note to Timeline</button>

  <input type="text" id="noteTags" placeholder="Tags (comma separated)" />
  <button id="saveBtn"><span>⬇️</span> Download Session as PDF</button>
  <div id="status" class="status"></div>
  
  <script src="lib/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
