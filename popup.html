<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Base Body Styling (Dark mode match) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      width: 320px;
      margin: 0;
      /* Background matches common dark IDEs/OS themes */
      background-color: #1a1a1a;
      /* Define base light text color */
      color: #eee;
    }

    /* Input & Textarea Styling (dark inputs, light text) */
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin: 4px 0 10px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      /* Dark input background */
      background-color: #2b2b2b;
      /* Light input text */
      color: #eee;
      /* Subtle border */
      border: 1px solid #444;
      border-radius: 4px;
      transition: border-color 0.1s;
    }
    input:focus, textarea:focus {
      border-color: #0969da;
      outline: none;
      box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.3);
    }
    /* Input Placeholders */
    input::placeholder, textarea::placeholder {
      color: #888;
    }

    textarea {
      height: 90px;
      resize: vertical;
    }

    /* Labels */
    label {
      font-size: 12px;
      font-weight: bold;
      /* Subtly darker light for labels */
      color: #aaa;
    }

    /* Highlight On Page buttons row */
    .color-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      justify-content: start;
      padding-left: 2px;
    }
    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ccc;
      transition: transform 0.1s;
    }
    .color-btn:hover {
      transform: scale(1.1);
      border-color: #eee;
    }
    /* Glow effect for colors on dark background */
    .color-btn[data-color="#fff59d"] { box-shadow: 0 0 10px rgba(255, 245, 157, 0.4); }
    .color-btn[data-color="#a5d6a7"] { box-shadow: 0 0 10px rgba(165, 214, 167, 0.4); }
    .color-btn[data-color="#90caf9"] { box-shadow: 0 0 10px rgba(144, 202, 249, 0.4); }
    .color-btn[data-color="#f48fb1"] { box-shadow: 0 0 10px rgba(244, 143, 177, 0.4); }

    /* Button Styling */
    button {
      border: none;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.1s;
      padding: 10px;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Secondary Button (Take Screenshot - Dark Grey) */
    #snapBtn {
      background: #24292f;
      color: white;
      margin-bottom: 10px;
    }
    #snapBtn:hover {
      background: #32383f;
    }

    /* Primary Button (Commit Blue) */
    #saveBtn {
      background: #0969da;
      color: white;
    }
    #saveBtn:hover {
      background: #0d7bf9;
    }
    /* Disabled behavior when saving */
    #saveBtn:disabled {
      background: #3e4a5d;
      cursor: wait;
    }

    /* Preview Image Box (Hidden by default) */
    #previewImg {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #444;
      margin-bottom: 12px;
      display: none;
    }

    /* Status message */
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #aaa;
    }
    .status.success {
      color: #6bc47d;
    }
    .status.error {
      color: #cf222e;
    }

  </style>
</head>
<body>
  <label>Highlight on Page</label>
  <div class="color-row">
    <div class="color-btn" data-color="#fff59d" style="background: #fff59d;"></div>
    <div class="color-btn" data-color="#a5d6a7" style="background: #a5d6a7;"></div>
    <div class="color-btn" data-color="#90caf9" style="background: #90caf9;"></div>
    <div class="color-btn" data-color="#f48fb1" style="background: #f48fb1;"></div>
  </div>

  <!-- FIXED: Character code &#128247; used for camera icon to prevent encoding errors -->
  <button id="snapBtn"><span>&#128247;</span> Take Screenshot</button>
  <img id="previewImg" alt="Screenshot preview" />

  <label for="title">Note Title / Filename</label>
  <input type="text" id="title" placeholder="Untitled Note" />

  <label for="tags">Tags</label>
  <input type="text" id="tags" placeholder="comma, separated" />

  <label for="content">Note Content (Markdown)</label>
  <textarea id="content" placeholder="Type your note or use highlights..."></textarea>

  <button id="saveBtn">Commit to GitHub</button>
  <div id="status" class="status"></div>
  
  <!-- popup.js must exist in the same folder -->
  <script src="popup.js"></script>
</body>
</html>
