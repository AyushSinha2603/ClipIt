<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* Antigravity-style Dark Theme based on your screenshot */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 15px;
      width: 350px;
      margin: 0;
      background-color: #1e1e1e;
      color: #e0e0e0;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      margin: 4px 0 12px;
      padding: 10px;
      font-family: inherit;
      font-size: 13px;
      background-color: #2d2d2d;
      color: #eee;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
    }
    input:focus, textarea:focus { border-color: #555; outline: none; }
    textarea { resize: vertical; height: 60px; }
    label { font-size: 12px; font-weight: 600; color: #ccc; display: block; margin-bottom: 6px; }

    /* Highlights */
    .color-row { display: flex; gap: 12px; margin-bottom: 15px; }
    .color-btn { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-btn:hover { transform: scale(1.05); border-color: #fff; }

    /* Action Row (Crop / Reset) */
    .action-row { display: flex; gap: 10px; margin-bottom: 15px; }
    button {
      border: none; border-radius: 4px; cursor: pointer; font-weight: 600;
      padding: 10px 12px; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    #snapBtn { background: #2d2d2d; color: #fff; flex: 1.2; border: 1px solid #3d3d3d; }
    #snapBtn:hover { background: #3d3d3d; }
    #resetBtn { background: transparent; color: #d32f2f; border: 1px solid #d32f2f; flex: 1; }
    #resetBtn:hover { background: rgba(211, 47, 47, 0.1); }

    /* Timeline & Notes */
    .timeline-container {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
      padding: 8px; background-color: #222; border-radius: 4px;
      border: 1px solid #333; max-height: 180px; overflow-y: auto;
    }
    .timeline-item { position: relative; border: 1px solid #444; border-radius: 4px; padding: 8px; background-color: #2b2b2b; }
    .timeline-screenshot img { width: 100%; height: auto; border-radius: 4px; display: block; }
    .timeline-text { color: #ddd; font-size: 12px; word-break: break-word; }
    .timeline-delete {
      position: absolute; top: 4px; right: 4px; width: 16px; height: 16px;
      background-color: #444; color: #bbb; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; cursor: pointer;
    }
    .timeline-delete:hover { background-color: #d32f2f; color: #fff; }

    #addNoteBtn { background: #2d2d2d; color: #fff; margin-bottom: 12px; border: 1px solid #3d3d3d; }
    #addNoteBtn:hover { background: #3d3d3d; }

    /* NEW: AI and Export Buttons */
    #aiBtn { background: #6e40c9; color: white; width: 100%; margin-bottom: 10px; }
    #aiBtn:hover { background: #5a32a3; }
    
    .export-row { display: flex; gap: 10px; margin-bottom: 5px; }
    #saveBtn { background: #2ea44f; color: white; flex: 1; }
    #saveBtn:hover { background: #2c974b; }
    #gitBtn { background: #238636; color: white; flex: 1; }
    #gitBtn:hover { background: #2ea44f; }
    
    #optionsBtn { background: transparent; color: #888; font-size: 11px; padding: 4px; width: 100%; }
    #optionsBtn:hover { color: #ccc; text-decoration: underline; }

    .status { margin-top: 6px; font-size: 12px; text-align: center; color: #aaa; min-height: 15px; }
    .status.success { color: #3fb950; }
    .status.error { color: #f85149; }
  </style>
</head>
<body>
  <input type="text" id="noteTitle" placeholder="Session Title (e.g. Stanley Goble - Wikipedia)" />

  <label>Highlight Text on Page (Select & Click Color)</label>
  <div class="color-row">
    <div class="color-btn" data-color="#fff59d" style="background: #fff59d;"></div>
    <div class="color-btn" data-color="#a5d6a7" style="background: #a5d6a7;"></div>
    <div class="color-btn" data-color="#90caf9" style="background: #90caf9;"></div>
    <div class="color-btn" data-color="#f48fb1" style="background: #f48fb1;"></div>
  </div>

  <div class="action-row">
    <button id="snapBtn"><span>✂️</span> Crop Screen</button>
    <button id="resetBtn"><span>✕</span> Reset Session</button>
  </div>

  <label>Session Timeline</label>
  <div id="clipTimeline" class="timeline-container"></div>

  <label>Add Manual Note</label>
  <textarea id="scratchpad" placeholder="Draft a note to add to timeline..."></textarea>
  <button id="addNoteBtn">Add Note</button>

  <input type="text" id="noteTags" placeholder="Tags (comma separated)" />

  <!-- NEW FEATURES -->
  <button id="aiBtn"><span>✨</span> Generate AI Summary & Tags</button>
  
  <div class="export-row">
    <button id="saveBtn"><span>⬇️</span> Download PDF</button>
    <button id="gitBtn"><span>🐙</span> Push to Git</button>
  </div>

  <button id="optionsBtn">Configure GitHub Settings</button>
  <div id="status" class="status"></div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
